org.gradle.jvmargs=-Xmx4608m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false

# Kept false: the MF919 app resolves resources transitively today. Flipping this
# to true is a source-compatibility change across ~90 layouts and belongs in a
# later phase, not in the Phase 0 restructure.
android.nonTransitiveRClass=false
android.nonFinalResIds=false

kotlin.code.style=official

# Gradle's experimental HTML problems report writes to the ROOT project's build dir, and any
# process holding that one file open makes EVERY build exit non-zero with
# `AccessDeniedException: build/reports/problems/problems-report.html` -- long after all real
# work has succeeded. Android Studio's daemon holds it, so a build run from the CLI while the
# IDE is open reports FAILED on a green build. That is worse than useless on a payment
# terminal: it hides genuine failures and would make any CI job (audit item B2) permanently red.
# The report itself carries nothing the console does not already print.
org.gradle.problems.report=false
